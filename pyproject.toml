[project]
name = "minecraft-scientist"
version = "0.1.0"
description = "An offline, reproducible testbed for active symbolic world-model discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
visual = ["pillow>=10,<13"]
geometry = ["pillow>=10,<13", "opencv-python-headless>=4.8,<5"]
train = [
    "gymnasium>=1.1,<2",
    "torch>=2.7,<3",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
minecraft-scientist = "minecraft_scientist.cli:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["minecraft_scientist"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "train" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
